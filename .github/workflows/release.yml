name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Explicitly check out the ref that triggered the event (the tag)
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test -- --run

      # Flumen SPM target copies Sources/dist; that folder is gitignored and only
      # needed so the package graph can build. Native unit tests use FlumenCore/IPC.
      - name: Ensure SPM web resource stub
        run: |
          mkdir -p macos/Pomodoro/Sources/dist
          if [ ! -f macos/Pomodoro/Sources/dist/index.html ]; then
            printf '%s\n' '<!doctype html><html><body>Flumen</body></html>' \
              > macos/Pomodoro/Sources/dist/index.html
          fi

      - name: Run native tests
        run: swift test --package-path macos/Pomodoro

      - name: Set Environment Variables
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_name }}" == *"-staging"* ]]; then
            echo "IS_STAGING=true" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=staging" >> "$GITHUB_ENV"
            echo "APPCAST_FILE=flumen-appcast-staging.xml" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
            echo "Detected staging release tag: ${{ github.ref_name }}"
          else
            echo "IS_STAGING=false" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=main" >> "$GITHUB_ENV"
            echo "APPCAST_FILE=flumen-appcast.xml" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
            echo "Detected production release tag/ref: ${{ github.ref_name }}"
          fi

      - name: Build App
        env:
          FLUMEN_SIGNING_IDENTITY: ${{ secrets.FLUMEN_SIGNING_IDENTITY }}
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Verify universal signed bundle
        run: |
          set -euo pipefail
          test -x Flumen.app/Contents/MacOS/Flumen
          test -x Flumen.app/Contents/Helpers/flumen-mcp
          lipo Flumen.app/Contents/MacOS/Flumen -verify_arch arm64 x86_64
          lipo Flumen.app/Contents/Helpers/flumen-mcp -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 Flumen.app
          /usr/bin/file Flumen.app/Contents/MacOS/Flumen
          /usr/bin/file Flumen.app/Contents/Helpers/flumen-mcp
          npm run test:mcp

      - name: Notarize Developer ID build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          FLUMEN_SIGNING_IDENTITY: ${{ secrets.FLUMEN_SIGNING_IDENTITY }}
        run: |
          if [ -z "$FLUMEN_SIGNING_IDENTITY" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Developer ID notarization credentials are not configured; retaining the existing ad-hoc release path."
            exit 0
          fi

          xcrun notarytool submit Flumen_macOS_Universal.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple Flumen.app
          rm -f Flumen_macOS_Universal.zip
          ditto -c -k --keepParent Flumen.app Flumen_macOS_Universal.zip

      - name: Setup Sparkle Tools
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Keep generate_appcast aligned with the Sparkle release we historically ship tools from.
          SPARKLE_TOOLS_VERSION="2.8.1"
          mkdir -p sparkle_tools
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz" \
            | tar -xJ -C sparkle_tools
          test -x sparkle_tools/bin/generate_appcast
          echo "$(pwd)/sparkle_tools/bin" >> "$GITHUB_PATH"

      - name: Sign and Generate Appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ ! -f Flumen_macOS_Universal.zip ]; then
            echo "❌ Error: Flumen_macOS_Universal.zip not found!"
            exit 1
          fi

          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "❌ Error: SPARKLE_PRIVATE_KEY secret is empty."
            exit 1
          fi

          if [ -z "${APPCAST_FILE:-}" ]; then
            echo "❌ Error: APPCAST_FILE is unset (staging/production env step failed)."
            exit 1
          fi

          printf '%s' "$SPARKLE_PRIVATE_KEY" > sparkle_key.priv
          chmod 600 sparkle_key.priv
          trap 'rm -f sparkle_key.priv' EXIT

          rm -rf appcast_work
          mkdir -p appcast_work
          cp Flumen_macOS_Universal.zip appcast_work/

          # Re-use the existing feed when present so prior items are preserved/updated.
          if [ -f "$APPCAST_FILE" ]; then
            cp "$APPCAST_FILE" "appcast_work/$APPCAST_FILE"
          fi

          REPO_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          echo "🌐 Generating signed $APPCAST_FILE..."
          echo "   download-url-prefix: $REPO_URL"

          # Write in place inside appcast_work/ (do not use -o with a bare filename;
          # Sparkle treats that as repo-root output, not appcast_work/).
          ./sparkle_tools/bin/generate_appcast \
            --download-url-prefix "$REPO_URL" \
            --ed-key-file sparkle_key.priv \
            appcast_work/

          if [ -f "appcast_work/$APPCAST_FILE" ]; then
            cp "appcast_work/$APPCAST_FILE" "./$APPCAST_FILE"
          elif [ -f "appcast_work/appcast.xml" ]; then
            cp "appcast_work/appcast.xml" "./$APPCAST_FILE"
          else
            echo "❌ Error: Could not find generated appcast file!"
            ls -laR appcast_work/
            exit 1
          fi

          echo "🔎 Validating $APPCAST_FILE..."
          grep -q '<rss ' "$APPCAST_FILE"
          grep -q '<enclosure ' "$APPCAST_FILE"
          grep -q 'sparkle:edSignature=' "$APPCAST_FILE"
          grep -q "releases/download/${{ github.ref_name }}/Flumen_macOS_Universal.zip" "$APPCAST_FILE"
          echo "✅ $APPCAST_FILE generated and validated."
          head -n 40 "$APPCAST_FILE"

      - name: Commit Appcast
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail

          if [ ! -f "$APPCAST_FILE" ]; then
            echo "❌ Error: $APPCAST_FILE missing before commit step."
            exit 1
          fi

          if [ -z "${TARGET_BRANCH:-}" ]; then
            echo "❌ Error: TARGET_BRANCH is unset."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Preserve the generated appcast across the branch switch (checkout
          # starts from the tag tip in a detached HEAD).
          APPCAST_TEMP="$RUNNER_TEMP/$APPCAST_FILE"
          cp "$APPCAST_FILE" "$APPCAST_TEMP"

          git fetch origin "$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          cp "$APPCAST_TEMP" "./$APPCAST_FILE"
          git add -- "$APPCAST_FILE"

          if git diff --cached --quiet; then
            echo "No appcast content changes to commit."
          else
            git commit -m "chore: update $APPCAST_FILE [skip ci]"
          fi

          # Rebase-retry so a concurrent branch tip advance does not fail the job.
          pushed=false
          for attempt in 1 2 3; do
            if git push origin "$TARGET_BRANCH"; then
              pushed=true
              break
            fi
            echo "Push rejected (attempt $attempt); fetching and rebasing onto origin/$TARGET_BRANCH..."
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
          done

          if [ "$pushed" != true ]; then
            echo "❌ Error: failed to push appcast commit to $TARGET_BRANCH after retries."
            exit 1
          fi

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Flumen_macOS_Universal.zip
            ${{ env.APPCAST_FILE }}
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
